name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Create project files
        run: |
          mkdir -p www
          cat > package.json <<'PKG_EOF'
          {
            "name": "neon-snake",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          PKG_EOF
          cat > capacitor.config.json <<'CFG_EOF'
          {
            "appId": "com.neonsnake.game",
            "appName": "Змейка",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          CFG_EOF
          cat > www/index.html <<'HTML_EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
          <meta name="theme-color" content="#07130d">
          <title>Змейка · Неоновый сад</title>
          <style>
          :root{
            --bg0:#07130d; --bg1:#0c1f16; --surface:#11291d; --surface2:#173425;
            --line:rgba(130,255,160,.14); --line2:rgba(130,255,160,.30);
            --acid:#a3ff3f; --emerald:#2fe07c; --deep:#0f8a52;
            --cyan:#39e6ff; --magenta:#ff4fd8; --amber:#ffb02e; --red:#ff4d5e; --coral:#ff6a4d;
            --ink:#eafff0; --muted:#8fb8a0; --scrim:rgba(4,12,8,.82);
            --disp:'Unbounded',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
          }
          *{margin:0;padding:0;box-sizing:border-box}
          html{scrollbar-color:var(--deep) var(--bg0);scrollbar-width:thin}
          ::-webkit-scrollbar{width:10px;height:10px}
          ::-webkit-scrollbar-track{background:var(--bg0)}
          ::-webkit-scrollbar-thumb{background:linear-gradient(var(--emerald),var(--deep));border-radius:8px;border:2px solid var(--bg0)}
          body{
            font-family:var(--body);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;
            background:
              radial-gradient(1100px 700px at 12% -10%,rgba(47,224,124,.13),transparent 60%),
              radial-gradient(900px 600px at 105% 15%,rgba(57,230,255,.10),transparent 60%),
              radial-gradient(800px 700px at 50% 115%,rgba(255,79,216,.08),transparent 60%),
              linear-gradient(180deg,var(--bg1),var(--bg0) 55%);
            -webkit-user-select:none;user-select:none;
          }
          .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
          .aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.20;mix-blend-mode:screen}
          .aurora i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,#1ec86b,transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
          .aurora i:nth-child(2){width:44vmax;height:44vmax;right:-12vmax;top:6vmax;background:radial-gradient(circle,#1798c9,transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
          .aurora i:nth-child(3){width:40vmax;height:40vmax;left:28vmax;bottom:-20vmax;background:radial-gradient(circle,#b0369b,transparent 65%);animation:drift3 38s ease-in-out infinite alternate}
          @keyframes drift1{to{transform:translate(9vmax,7vmax) scale(1.15)}}
          @keyframes drift2{to{transform:translate(-8vmax,9vmax) scale(.9)}}
          @keyframes drift3{to{transform:translate(-10vmax,-8vmax) scale(1.2)}}
          #flies{position:fixed;inset:0;z-index:1;pointer-events:none}
          #flies span{position:absolute;border-radius:50%;animation:fly linear infinite;opacity:0}
          @keyframes fly{0%{transform:translate(0,0);opacity:0}12%{opacity:.9}50%{transform:translate(26px,-42px);opacity:.5}88%{opacity:.8}100%{transform:translate(-18px,-90px);opacity:0}}

          header{
            position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
            gap:12px;flex-wrap:wrap;padding:10px clamp(12px,3vw,28px);
            background:rgba(8,18,13,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid var(--line);
          }
          .logo{display:flex;align-items:baseline;gap:10px;line-height:1}
          .logo .em{font-size:26px;filter:drop-shadow(0 0 10px rgba(163,255,63,.6));animation:bob 3.4s ease-in-out infinite}
          @keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}
          .logo b{font-family:var(--disp);font-weight:900;font-size:clamp(17px,2.4vw,22px);letter-spacing:.06em;background:linear-gradient(92deg,var(--acid),var(--emerald) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
          .logo small{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
          .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
          .btn{
            font-family:var(--body);font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:9px 14px;
            transition:transform .12s ease,background .15s,box-shadow .2s,filter .15s;touch-action:manipulation;
          }
          .btn:hover{background:var(--surface2)}
          .btn:active{transform:scale(.96)}
          .btn:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
          .btn:disabled{opacity:.4;cursor:default;transform:none}
          .btn svg{width:18px;height:18px;flex:none}
          .btn-icon{width:40px;height:40px;padding:0}
          .btn-primary{background:linear-gradient(95deg,var(--acid),var(--emerald));color:#06130b;border:none;box-shadow:0 4px 22px rgba(120,255,90,.28),inset 0 1px 0 rgba(255,255,255,.35)}
          .btn-big{font-size:17px;padding:14px 30px;border-radius:14px;font-family:var(--disp);font-weight:700;letter-spacing:.03em}
          .btn-danger{border-color:rgba(255,77,94,.4);color:#ffb9c0}
          .diff-field{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:0 10px;height:40px}
          .diff-field span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
          select{appearance:none;-webkit-appearance:none;background:transparent;border:none;color:var(--ink);font-family:var(--body);font-weight:800;font-size:14px;cursor:pointer;padding:4px 18px 4px 2px}
          select option{background:var(--surface);color:var(--ink)}
          .hide{display:none!important}

          main{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px clamp(10px,3vw,24px) 26px}
          .hud{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(96vw,760px)}
          .card{flex:1 1 110px;min-width:100px;background:linear-gradient(160deg,var(--surface),rgba(17,41,29,.55));border:1px solid var(--line);border-radius:14px;padding:8px 12px 9px;position:relative;overflow:hidden}
          .card label{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
          .card .val{font-family:var(--disp);font-weight:700;font-size:clamp(17px,2.6vw,22px);line-height:1.15}
          .card .sub{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          #hudScore{color:var(--acid);text-shadow:0 0 18px rgba(163,255,63,.4)}
          #hudBest{color:var(--amber)}
          .dots{display:flex;gap:4px;margin-top:4px}
          .dots i{width:12px;height:5px;border-radius:3px;background:rgba(140,220,170,.18)}
          .dots i.on{background:var(--emerald);box-shadow:0 0 8px rgba(47,224,124,.7)}
          #comboCard .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--amber),var(--coral));width:0%}
          #comboCard.hot .val{color:var(--amber);text-shadow:0 0 16px rgba(255,176,46,.55)}
          .chips{display:flex;gap:8px;min-height:26px;flex-wrap:wrap;justify-content:center}
          .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 12px;border-radius:99px;border:1px solid}
          .chip.cyan{color:var(--cyan);border-color:rgba(57,230,255,.45);background:rgba(57,230,255,.1)}
          .chip.magenta{color:var(--magenta);border-color:rgba(255,79,216,.45);background:rgba(255,79,216,.1)}
          .chip.amber{color:var(--amber);border-color:rgba(255,176,46,.5);background:rgba(255,176,46,.1)}

          .arena{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
          .board-frame{
            flex:none;padding:2px;border-radius:24px;
            width:max(260px,min(560px,calc(100vw - 330px),calc(100dvh - 280px)));
            background:linear-gradient(160deg,rgba(163,255,63,.5),rgba(47,224,124,.22) 40%,rgba(57,230,255,.4));
            box-shadow:0 0 70px rgba(80,255,140,.13),0 24px 60px rgba(0,0,0,.5);
          }
          .board-inner{position:relative;border-radius:22px;overflow:hidden;background:#08150e;aspect-ratio:1/1}
          canvas{display:block;width:100%;height:100%;touch-action:none}
          #toast{position:absolute;top:12px;left:50%;transform:translate(-50%,-70px);z-index:7;background:rgba(23,52,37,.95);border:1px solid var(--line2);color:var(--ink);font-weight:800;font-size:13px;padding:8px 18px;border-radius:99px;white-space:nowrap;transition:transform .35s cubic-bezier(.22,1.3,.36,1);pointer-events:none}
          #toast.show{transform:translate(-50%,0)}
          #count{position:absolute;inset:0;z-index:5;display:none;place-items:center;pointer-events:none}
          #countNum{font-family:var(--disp);font-weight:900;font-size:clamp(64px,18vw,110px);color:var(--acid);text-shadow:0 0 40px rgba(163,255,63,.7)}
          #countNum.pop{animation:cpop .55s cubic-bezier(.22,1.4,.36,1)}
          @keyframes cpop{from{transform:scale(1.7);opacity:0}30%{opacity:1}}
          #countNum.go{animation:goFade .7s ease forwards;color:var(--cyan);font-size:clamp(38px,10vw,60px)}
          @keyframes goFade{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.1);opacity:1}70%{opacity:1}100%{transform:scale(1.25);opacity:0}}

          .control-deck{
            flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;min-width:205px;
            background:linear-gradient(165deg,var(--surface),rgba(17,41,29,.5));border:1px solid var(--line);
            border-radius:20px;padding:16px 18px;
          }
          .deck-title{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
          .dpad{display:grid;grid-template-areas:". u ." "l m r" ". d .";gap:8px}
          .dpad button{
            width:58px;height:58px;border-radius:16px;background:#0e2418;border:1px solid var(--line2);
            color:var(--acid);display:grid;place-items:center;cursor:pointer;touch-action:none;
            transition:transform .08s,background .12s,box-shadow .15s,border-color .15s;
          }
          .dpad button svg{width:26px;height:26px;pointer-events:none}
          .dpad button:active,.dpad button.tap{transform:scale(.88);background:rgba(47,224,124,.3)}
          .dpad button.lit{border-color:var(--acid);background:linear-gradient(160deg,rgba(163,255,63,.3),rgba(47,224,124,.15));box-shadow:0 0 20px rgba(163,255,63,.3);color:#dfffba}
          .dpad .u{grid-area:u}.dpad .d{grid-area:d}.dpad .l{grid-area:l}.dpad .r{grid-area:r}.dpad .m{grid-area:m;color:var(--muted)}
          .deck-dir{font-size:13px;font-weight:800;color:var(--muted)}
          .deck-dir b{color:var(--acid);font-family:var(--disp);font-size:12px}
          .deck-hint{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.7;font-weight:600}
          kbd{font-family:var(--body);font-weight:800;font-size:10.5px;background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;color:var(--ink)}

          .window-layer{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto}
          .window-layer.open{display:flex}
          .window{
            width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;position:relative;
            background:linear-gradient(165deg,#132e20,#0b1d13 72%);border:1px solid var(--line2);border-radius:22px;
            padding:clamp(18px,4vw,30px);box-shadow:0 30px 90px rgba(0,0,0,.6);
            animation:winIn .45s cubic-bezier(.2,1.2,.3,1);
          }
          @keyframes winIn{from{transform:translateY(30px) scale(.92);opacity:0}}
          .window::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--acid),var(--emerald),var(--cyan),var(--magenta));border-radius:22px 22px 0 0}
          .window-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
          .window-head .em{font-size:46px;line-height:1;filter:drop-shadow(0 0 16px rgba(163,255,63,.55))}
          .window-head h1,.window-head h2{font-family:var(--disp);font-weight:900;font-size:clamp(21px,5vw,29px);background:linear-gradient(92deg,var(--acid),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
          .window-head p{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
          .window p.lead{color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.55;margin-bottom:16px}
          .window p.lead b{color:var(--ink)}
          .section-label{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px}
          .modes{display:flex;flex-direction:column;gap:8px}
          .mode-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;color:var(--ink);font-family:var(--body);transition:all .15s}
          .mode-card.active{border-color:var(--acid);background:linear-gradient(100deg,rgba(163,255,63,.16),rgba(47,224,124,.05));box-shadow:0 0 20px rgba(163,255,63,.15)}
          .mode-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
          .mode-card.active .mode-radio{border-color:var(--acid)}
          .mode-card.active .mode-radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acid)}
          .mode-ico{font-size:24px;flex:none}
          .mode-txt{flex:1;min-width:0}
          .mode-txt b{display:block;font-size:14px;font-weight:800}
          .mode-card.active .mode-txt b{color:var(--acid)}
          .mode-txt small{display:block;color:var(--muted);font-size:11px;font-weight:600;margin-top:2px}
          .mode-meta{font-family:var(--disp);font-size:12px;font-weight:700;color:var(--amber);background:rgba(255,176,46,.1);border:1px solid rgba(255,176,46,.3);padding:4px 8px;border-radius:8px;flex:none}
          .menu-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0}
          .menu-best{font-size:13px;color:var(--amber);font-weight:800}
          .sound-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--ink);font-family:var(--body);font-weight:700;font-size:12.5px}
          .switch{width:42px;height:23px;border-radius:99px;background:#31473a;position:relative;transition:background .2s;flex:none}
          .switch i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#9fb8a8;transition:left .2s,background .2s}
          .sound-row[aria-pressed="true"] .switch{background:rgba(163,255,63,.25)}
          .sound-row[aria-pressed="true"] .switch i{left:22px;background:var(--acid)}
          .rules{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
          .rule{display:flex;align-items:center;gap:8px;background:rgba(17,41,29,.75);border:1px solid var(--line);border-radius:11px;padding:7px 10px;font-size:12px;font-weight:700}
          .rule em{font-style:normal;font-size:17px}
          .rule small{display:block;color:var(--muted);font-weight:600;font-size:10.5px}
          .window .btn-big{width:100%;margin-top:4px}
          .key-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.8;font-weight:600}
          .center{text-align:center}
          .center .big-em{font-size:54px;line-height:1;margin-bottom:10px}
          .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin:16px 0}
          .stat{background:rgba(17,41,29,.8);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left}
          .stat label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
          .stat .v{font-family:var(--disp);font-weight:700;font-size:19px}
          .stat.wide{grid-column:1/-1}
          .stat .v.acid{color:var(--acid);font-size:26px}
          .stat .v.amber{color:var(--amber)}
          .badge{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;color:#06130b;background:linear-gradient(90deg,var(--amber),var(--coral));padding:2px 8px;border-radius:99px;vertical-align:middle}
          .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
          .title-grad{font-family:var(--disp);font-weight:900;font-size:28px;background:linear-gradient(92deg,var(--acid),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}

          @media (max-width:900px){
            .arena{flex-direction:column;gap:12px}
            .board-frame{width:max(235px,min(94vw,560px,calc(100dvh - 430px)))}
            .control-deck{flex-direction:row;flex-wrap:wrap;justify-content:center;min-width:0;width:min(94vw,560px);padding:10px 12px;gap:10px}
            .deck-title,.deck-hint{display:none}
            .dpad button{width:52px;height:52px;border-radius:14px}
            .hud{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:min(96vw,560px)}
            .card{min-width:0;padding:5px 6px 6px;border-radius:10px}
            .card label{font-size:8px;letter-spacing:.05em}
            .card .val{font-size:14px}
            .card .sub,.dots{display:none}
          }
          @media (max-width:560px){
            .btn .btn-label{display:none}
            .btn{padding:9px 11px}
            .diff-field span{display:none}
            header{padding:8px 12px}
            .logo small{display:none}
            .rules{grid-template-columns:1fr}
            .window{padding:18px 16px}
          }
          </style>
          </head>
          <body>
          <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
          <div id="flies" aria-hidden="true"></div>

          <header>
            <div class="logo"><span class="em">🐍</span><b>ЗМЕЙКА</b><small>неоновый сад</small></div>
            <div class="controls">
              <button type="button" class="btn btn-icon" id="btnSound" aria-label="Звук" aria-pressed="true">
                <svg id="icoSndOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9.5 9.5 0 0 1 0 13"/></svg>
                <svg id="icoSndOff" class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
              </button>
              <button type="button" class="btn btn-icon" id="btnPause" aria-label="Пауза" disabled>
                <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
                <svg id="icoPlay" class="hide" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
              </button>
              <label class="diff-field"><span>Режим</span>
                <select id="selDiff" aria-label="Сложность">
                  <option value="easy">Прогулка</option>
                  <option value="normal" selected>Классика</option>
                  <option value="hard">Хардкор</option>
                </select>
              </label>
              <button type="button" class="btn btn-danger" id="btnRestart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
                <span class="btn-label">Заново</span>
              </button>
            </div>
          </header>

          <main>
            <section class="hud">
              <div class="card"><label>Счёт</label><div class="val" id="hudScore">0</div></div>
              <div class="card"><label>🏆 Рекорд</label><div class="val" id="hudBest">0</div></div>
