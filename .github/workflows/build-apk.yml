                <div class="stat wide"><label>Счёт</label><div class="v acid" id="stScore">0</div></div>
                <div class="stat"><label>Рекорд</label><div class="v amber"><span id="stBest">0</span><span class="badge hide" id="recordBadge">Новый!</span></div></div>
